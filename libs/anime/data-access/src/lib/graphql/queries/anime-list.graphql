query AnimeList(
  $page: Int = 1
  $perPage: Int = 12
  $search: String
  $format: MediaFormat
  $sort: [MediaSort] = [POPULARITY_DESC]
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      currentPage
      hasNextPage
    }
    media(type: ANIME, search: $search, format: $format, sort: $sort) {
      id
      title {
        romaji
        english
      }
      coverImage {
        large
      }
      averageScore
      format
      genres
    }
  }
}
